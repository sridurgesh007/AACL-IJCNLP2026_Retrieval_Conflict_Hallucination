name: Validate code-only release
on: [push, pull_request]
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
